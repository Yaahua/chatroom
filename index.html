<!doctype html>
<html lang="zh-CN">

    <meta charset="UTF-8" />

    <title>哈吉米德的聊天室</title>

    <link rel="stylesheet" crossorigin href="/chatroom/assets/index-BlytvNkI.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 禁止双指缩放（JS 双重保险）-->
    <script>
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </body>
</html>
